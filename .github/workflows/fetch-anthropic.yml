name: Fetch Anthropic Articles

on:
  schedule:
    - cron: "0 17 * * *"  # 17:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out feed configuration and XML
        uses: ./.github/actions/checkout-feeds
        with:
          token: ${{ secrets.XML_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Fetch Anthropic articles
        run: python -c "import asyncio; from run_daily import run_feed; asyncio.run(run_feed('ANTHROPIC'))"

      - name: Commit articles
        run: |
          bash .github/scripts/publish_xml.sh \
            "chore: anthropic fetch $(date -u +%Y-%m-%d)" \
            "$ANTHROPIC_FEED_PATH"
