name: Test Ollama 1b

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama and pull llama3.2:1b
        run: |
          ollama serve &
          sleep 5
          ollama pull llama3.2:1b

      - name: Test commit summary
        run: |
          git log --pretty=format:"%h %s" --after="2026-11-27T00:00:00Z" > /tmp/commits.txt
          echo "Commits found:"; cat /tmp/commits.txt; echo "---"
          python3 - <<'EOF'
          import json, urllib.request
          from datetime import date

          commits = open("/tmp/commits.txt").read().strip()
          payload = {
              "model": "llama3.2:1b",
              "stream": False,
              "messages": [
                  {"role": "system", "content": "You are a concise technical reporter. Given git commit messages, write a 2-3 sentence plain-English summary of what changed today and why. Be specific, not generic."},
                  {"role": "user", "content": f"Repository: jayreck996/py-rss\nDate: {date.today()}\n\nCommits:\n{commits}"},
              ],
          }
          req = urllib.request.Request(
              "http://localhost:11434/api/chat",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=120) as resp:
              data = json.load(resp)
          print(data["message"]["content"])
          EOF
