name: Daily Report

on:
  schedule:
    - cron: "0 2 * * *"  # 02:00 UTC daily, after all fetch workflows complete
  workflow_dispatch:
    inputs:
      model:
        description: "GitHub Models model ID"
        required: false
        default: "gpt-4o-mini"
        type: choice
        options:
          - gpt-4o-mini
          - Meta-Llama-3.1-70B-Instruct

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe GitHub Models endpoints
        run: |
          probe() {
            local label="$1" url="$2"
            shift 2
            code=$(curl -s -o /dev/null -w "%{http_code}" "$@" "$url" 2>/dev/null || echo "000")
            echo "$label -> $code"
          }
          AUTH="-H Authorization: Bearer $GITHUB_TOKEN"
          probe "api.githubcopilot.com/chat/completions" \
            "https://api.githubcopilot.com/chat/completions" \
            -H "Authorization: Bearer $GITHUB_TOKEN"
          probe "api.github.com/copilot/chat/completions" \
            "https://api.github.com/copilot/chat/completions" \
            -H "Authorization: Bearer $GITHUB_TOKEN"
          probe "api.github.com/copilot/v1/engines/copilot-codex/completions" \
            "https://api.github.com/copilot/v1/engines/copilot-codex/completions" \
            -H "Authorization: Bearer $GITHUB_TOKEN"
          probe "api.github.com/models/inference" \
            "https://api.github.com/models/inference" \
            -H "Authorization: Bearer $GITHUB_TOKEN"
          echo "=== Copilot token endpoint ==="
          curl -s -o /dev/null -w "copilot token endpoint -> %{http_code}\n" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/copilot_internal/v2/token || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create daily report issue
        run: python3 .github/scripts/daily_report.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL: ${{ inputs.model || 'gpt-4o-mini' }}
