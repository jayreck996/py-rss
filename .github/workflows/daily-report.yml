name: Daily Report

on:
  schedule:
    - cron: "0 2 * * *"  # 02:00 UTC daily, after all fetch workflows complete
  workflow_dispatch:
    inputs:
      model:
        description: "GitHub Models model ID"
        required: false
        default: "gpt-4o-mini"
        type: choice
        options:
          - gpt-4o-mini
          - Meta-Llama-3.1-70B-Instruct

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe Copilot chat endpoint (POST)
        run: |
          PAYLOAD='{"model":"gpt-4o","messages":[{"role":"user","content":"say hi"}],"max_tokens":5}'
          echo "--- POST to api.githubcopilot.com/chat/completions ---"
          curl -s -w "\nHTTP %{http_code}\n" \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Copilot-Integration-Id: vscode-chat" \
            -H "Editor-Version: vscode/1.95.0" \
            -d "$PAYLOAD" \
            https://api.githubcopilot.com/chat/completions || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create daily report issue
        run: python3 .github/scripts/daily_report.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL: ${{ inputs.model || 'gpt-4o-mini' }}
