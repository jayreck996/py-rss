name: Daily Report

on:
  schedule:
    - cron: "0 2 * * *"  # 02:00 UTC daily, after all fetch workflows complete
  workflow_dispatch:
    inputs:
      model:
        description: "Ollama model"
        required: false
        default: "llama3.2:1b"
        type: choice
        options:
          - llama3.2:1b
          - llama3.2:3b

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Create daily report issue
        run: python3 .github/scripts/daily_report.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL: ${{ inputs.model || 'llama3.2:1b' }}
