name: Fetch Coinbase Articles

on:
  schedule:
    - cron: "0 17 * * *"  # 17:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out feed configuration and XML
        uses: ./.github/actions/checkout-feeds
        with:
          token: ${{ secrets.XML_PAT }}
          feed: COINBASE

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Fetch Coinbase articles
        run: python -c "import asyncio; from run_daily import run_coinbase; asyncio.run(run_coinbase())"

      - name: Commit articles
        run: |
          bash .github/scripts/publish_xml.sh \
            "chore: coinbase fetch $(date -u +%Y-%m-%d)" \
            "$COINBASE_FEED_PATH"
