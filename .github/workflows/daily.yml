name: Daily Aggregated Fetch

on:
  schedule:
    - cron: "30 17 * * *"  # 17:30 UTC daily
  workflow_dispatch:
    inputs:
      publish_existing:
        description: Publish the latest committed XML
        type: boolean
        default: false

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out feed configuration and XML
        uses: ./.github/actions/checkout-feeds
        with:
          token: ${{ secrets.XML_PAT }}

      - uses: actions/setup-python@v5
        if: inputs.publish_existing != true
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        if: inputs.publish_existing != true
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        if: inputs.publish_existing != true
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium
        if: inputs.publish_existing != true
        run: playwright install chromium --with-deps

      - name: Run tests
        if: inputs.publish_existing != true
        run: python -m unittest discover -s tests -v

      - name: Clear cached data and fetch fresh articles
        if: inputs.publish_existing != true
        run: python run_daily.py

      - name: Commit new articles
        if: inputs.publish_existing != true
        run: |
          bash .github/scripts/publish_xml.sh \
            "chore: daily fetch $(date -u +%Y-%m-%d)" \
            "$ANTHROPIC_FEED_PATH" \
            "$OPENAI_FEED_PATH" \
            "$COINBASE_FEED_PATH" \
            "$NINTENDO_FEED_PATH" \
            "$BINANCE_FEED_PATH"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare feed artifacts
        run: |
          mkdir -p _site
          cp "$ANTHROPIC_FEED_PATH" "_site/$ANTHROPIC_PAGES_NAME"
          cp "$OPENAI_FEED_PATH" "_site/$OPENAI_PAGES_NAME"
          cp "$COINBASE_FEED_PATH" "_site/$COINBASE_PAGES_NAME"
          cp "$NINTENDO_FEED_PATH" "_site/$NINTENDO_PAGES_NAME"
          if [ -f "$BINANCE_FEED_PATH" ]; then
            cp "$BINANCE_FEED_PATH" "_site/$BINANCE_PAGES_NAME"
          fi
          touch _site/.nojekyll

      - name: Upload feed artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}

      - name: Wait for the Pages artifact to become available
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME" \
              --jq '.total_count' | grep -qx 1; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Pages artifact did not become available"
          exit 1

      - name: Deploy feed to GitHub Pages
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          oidc_token=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -er '.value')
          echo "::add-mask::$oidc_token"
          deployment=$(gh api --method POST "repos/$GITHUB_REPOSITORY/pages/deployments" \
            -F "artifact_id=$ARTIFACT_ID" -f "pages_build_version=$GITHUB_SHA" \
            -f "oidc_token=$oidc_token")
          deployment_id=$(jq -er '.id' <<< "$deployment")
          echo "page_url=$(jq -er '.page_url' <<< "$deployment")" >> "$GITHUB_OUTPUT"

          for attempt in {1..24}; do
            status=$(gh api "repos/$GITHUB_REPOSITORY/pages/deployments/$deployment_id" --jq '.status')
            case "$status" in
              succeed) exit 0 ;;
              deployment_failed|deployment_cancelled|deployment_lost)
                echo "::error::Pages deployment reported $status"
                exit 1 ;;
            esac
            sleep 5
          done
          echo "::error::Pages deployment did not complete (last status: $status)"
          exit 1
