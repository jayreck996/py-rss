name: Daily Aggregated Fetch

on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialise submodules
        run: |
          git config --global url."https://${{ secrets.XML_PAT }}@github.com/jayreck996/XML".insteadOf "https://github.com/jayreck996/XML"
          git submodule update --init --checkout -- XML
          git -C XML checkout -B main origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Clear cached data and fetch fresh articles
        run: python run_daily.py

      - name: Commit new articles
        run: |
          BOT_NAME="github-actions[bot]"
          BOT_EMAIL="github-actions[bot]@users.noreply.github.com"
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          cd XML
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git add -- ANTHROPIC/XML-2026Q4.xml OPENAI/XML-2026Q4.xml COINBASE/XML-2026Q4.xml NINTENDO/XML-2026Q4.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: daily fetch $(date -u +%Y-%m-%d)"
            for attempt in 1 2 3 4 5; do
              if git push; then break; fi
              echo "XML push rejected (attempt $attempt) -- rebasing..."
              git fetch origin main && git rebase origin/main
            done
          fi
          cd ..
          git add XML
          git diff --staged --quiet && echo "Nothing new to commit." || \
            (git commit -m "chore: daily fetch $(date -u +%Y-%m-%d)" && \
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin main; then break; fi
              echo "parent push rejected (attempt $attempt) -- rebasing..."
              git fetch origin main && git rebase origin/main
            done)

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare feed artifacts
        run: |
          mkdir -p _site
          cp XML/ANTHROPIC/XML-2026Q4.xml _site/anthropic.xml
          cp XML/OPENAI/XML-2026Q4.xml _site/openai.xml
          cp XML/COINBASE/XML-2026Q4.xml _site/coinbase.xml
          cp XML/NINTENDO/XML-2026Q4.xml _site/nintendo.xml
          touch _site/.nojekyll

      - name: Upload feed artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy feed to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
